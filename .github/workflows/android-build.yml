name: Build Android PRoot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Make Gradle executable
        shell: bash
        run: chmod +x android/gradlew

      - name: Verify ARM64 PRoot libraries
        shell: bash
        run: |
          set -euo pipefail

          LIBDIR="android/proot-engine/src/main/jniLibs/arm64-v8a"

          test -f "$LIBDIR/libproot.so"
          test -f "$LIBDIR/libproot-loader.so"
          test -f "$LIBDIR/libpr-cli.so"

          echo "=== ARM64 libraries ==="
          file \
            "$LIBDIR/libproot.so" \
            "$LIBDIR/libproot-loader.so" \
            "$LIBDIR/libpr-cli.so"

          ls -lh "$LIBDIR"

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          find android/app/build/outputs -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Termux-Linux-PRoot-arm64-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
